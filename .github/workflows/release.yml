name: Build draft lab release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install tested dependency versions
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e ".[dev]"
      - run: python -m pytest
      - name: Demo application smoke test
        run: python -m membrane_control --demo --data-dir work/release-smoke --screenshot work/release-demo.png --quit-after 2

  verify-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Build wired and Bluetooth controller firmware
        working-directory: firmware
        run: pio run -e esp32-dry-run -e esp32-relay-bench -e esp32-valve-test -e esp32-physical -e esp32-bluetooth-dry-run -e esp32-bluetooth-physical -e esp32-pump-voltage-test -e esp32-pump-open-bucket-test -e esp32-ads1115-usb-monitor -e esp32-lab-rig-ads1115
      - name: Run native firmware safety tests
        working-directory: firmware
        run: pio test -e native
      - name: Stage the current lab rig firmware
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          target = 'esp32-lab-rig-ads1115'
          build = Path('firmware/.pio/build') / target
          output = Path('dist/lab-rig-ads1115')
          output.mkdir(parents=True, exist_ok=True)
          for name in ('firmware.bin', 'bootloader.bin', 'partitions.bin'):
              shutil.copy2(build / name, output / name)
          shutil.copy2(Path.home() / '.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin', output / 'boot_app0.bin')
          shutil.copy2('docs/lab-rig-ads1115.md', output / 'README.md')
          shutil.copy2('examples/lab-cwf-ads1115.json', output / 'CWF-water-test.json')
          (output / 'BUILD-INFO.json').write_text(json.dumps({'target': target, 'commit': os.environ['GITHUB_SHA'], 'profile': 'LabRigAds1115Profile.h'}, indent=2) + '\n')
          (output / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(output.iterdir()) if path.is_file() and path.name != 'SHA256SUMS.txt'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MembraneControl-LabRigADS1115-esp32
          path: dist/lab-rig-ads1115/*
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [verify-desktop, verify-firmware]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install tested dependency versions
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e ".[dev]"
      - name: Build versioned executable
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/build_windows.py --version "$env:RELEASE_TAG"
      - name: Build manually requested artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python packaging/build_windows.py
      - name: Test packaged executable
        run: python packaging/smoke_windows.py
      - name: Verify fresh-PC setup without installation
        run: python packaging/smoke_setup.py
      - uses: actions/upload-artifact@v4
        with:
          name: MembraneControl-windows-x64
          path: dist/release/*
          if-no-files-found: error
      - name: Create a draft prerelease after verification
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --json url --jq .url 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release already exists at $existing; keeping its published assets. This run's verified build is available as an Actions artifact."
            exit 0
          }
          $assets = Get-ChildItem -LiteralPath dist/release -File | Select-Object -ExpandProperty FullName
          gh release create $env:RELEASE_TAG @assets --draft --prerelease --verify-tag --title "Membrane Control $env:RELEASE_TAG (lab prototype)" --notes-file packaging/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
