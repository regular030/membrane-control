name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - name: Install development dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Demo application smoke test
        run: python -m membrane_control --demo --data-dir work/ci-smoke --screenshot work/ci-demo.png --quit-after 2

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build wired and Bluetooth controller firmware
        working-directory: firmware
        run: pio run -e esp32-dry-run -e esp32-relay-bench -e esp32-valve-test -e esp32-physical -e esp32-bluetooth-dry-run -e esp32-bluetooth-physical -e esp32-pump-voltage-test -e esp32-pump-open-bucket-test -e esp32-ads1115-usb-monitor -e esp32-lab-rig-ads1115
      - name: Build alternate pump PWM profiles
        working-directory: firmware
        run: pio run -e esp32-lab-rig-ads1115-io26 -e esp32-lab-rig-ads1115-io27 -e esp32-pump-voltage-test-io27 -e esp32-pump-open-bucket-test-io27
      - name: Run native firmware safety tests
        working-directory: firmware
        run: pio test -e native
      - name: Stage the current lab rig firmware
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          target = 'esp32-lab-rig-ads1115'
          build = Path('firmware/.pio/build') / target
          output = Path('dist/lab-rig-ads1115')
          output.mkdir(parents=True, exist_ok=True)
          for name in ('firmware.bin', 'bootloader.bin', 'partitions.bin'):
              shutil.copy2(build / name, output / name)
          shutil.copy2(Path.home() / '.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin', output / 'boot_app0.bin')
          shutil.copy2('docs/lab-rig-ads1115.md', output / 'README.md')
          shutil.copy2('examples/lab-cwf-ads1115.json', output / 'CWF-water-test.json')
          (output / 'BUILD-INFO.json').write_text(json.dumps({'target': target, 'commit': os.environ['GITHUB_SHA'], 'profile': 'LabRigAds1115Profile.h'}, indent=2) + '\n')
          (output / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(output.iterdir()) if path.is_file() and path.name != 'SHA256SUMS.txt'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MembraneControl-LabRigADS1115-esp32
          path: dist/lab-rig-ads1115/*
          if-no-files-found: error
          retention-days: 7

  windows-package:
    needs: [desktop-tests, firmware]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install tested dependency versions
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e ".[dev]"
      - name: Build portable Windows application
        run: python packaging/build_windows.py
      - name: Test packaged executable
        run: python packaging/smoke_windows.py
      - name: Verify fresh-PC setup without installation
        run: python packaging/smoke_setup.py
      - uses: actions/upload-artifact@v4
        with:
          name: MembraneControl-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish-main-build:
    needs: windows-package
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-main-build
      cancel-in-progress: false
    steps:
      - name: Download the tested Windows build
        uses: actions/download-artifact@v4
        with:
          name: MembraneControl-windows-x64
          path: dist/release
      - name: Publish a downloadable main build
        working-directory: dist/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current_head=$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_head" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skipping publication of this older build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Windows build manifests may contain CRLF line endings.
          tr -d '\r' < SHA256SUMS.txt | sha256sum --check -
          short_sha="${GITHUB_SHA:0:7}"
          build_tag="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${short_sha}"
          notes_file="${RUNNER_TEMP}/main-build-notes.md"
          cat > "$notes_file" <<EOF
          Automatically built and tested from main commit ${short_sha}.

          For a fresh PC with Python and ESP32 build tools, download the MembraneControl-Setup EXE under Assets.
          The regular Windows EXE and portable ZIP are available for app-only use.
          This is a development build. Review the lab's setup and approved sequence before physical operation.

          Commit: ${GITHUB_SERVER_URL}/${GH_REPO}/commit/${GITHUB_SHA}
          Build checks: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}
          EOF
          release_url=$(gh release create "$build_tag" ./*.exe ./*.zip ./*-build.json ./SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Main build ${GITHUB_RUN_NUMBER} (${short_sha})" --notes-file "$notes_file")
          printf '### Windows download\n\n[Open this build and download the EXE](%s)\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
