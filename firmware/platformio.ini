[platformio]
default_envs = esp32-dry-run

[env]
lib_deps = bblanchon/ArduinoJson@7.4.2
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
extra_scripts = post:compact_paths.py

[env:esp32-dry-run]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = ${env.build_flags} -DBASU_DRY_RUN=1
build_src_filter = -<*> +<main.cpp>

[env:esp32-physical]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = ${env.build_flags} -DBASU_DRY_RUN=0
build_src_filter = -<*> +<main.cpp>

[env:esp32-relay-bench]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<relay_bench_main.cpp>

[env:esp32-valve-test]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<valve_test_main.cpp>

[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = no
build_flags = ${env.build_flags} -Iinclude -Itest/mocks -DUNITY_INCLUDE_DOUBLE
extra_scripts = post:native_compiler.py
