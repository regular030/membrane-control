[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane-control"
version = "0.1.13"
description = "Membrane experiment controller and desktop acquisition application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "pyqtgraph>=0.14,<0.15", "numpy>=1.26,<3", "pyserial==3.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
membrane-control = "membrane_control.__main__:main"

[tool.setuptools.packages.find]
where = ["desktop/src"]

[tool.setuptools.package-data]
membrane_control = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["desktop/src"]
